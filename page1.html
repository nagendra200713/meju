<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            text-align: center;
            color: white;
            background: linear-gradient(135deg, #ff758c, #7b2ff7);
            padding: 40px 20px;
        }

        h1 {
            font-size: 25px;
        }

        .photo {
            width: 300px;
            height: 350px;
            margin: 30px auto;
            padding: 10px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px black;
        }

        .photo img {
            width: 100%;
            height: 300px;
            object-fit: cover;
            border-radius: 15px;
        }

        .photo p {
            color: #7b2ff7;
            font-size: 20px;
            font-weight: bold;
        }

        .btn {
            display: inline-block;
            padding: 15px 25px;
            background: white;
            color: #7b2ff7;
            text-decoration: none;
            border-radius: 30px;
            font-weight: bold;
        }
        
    </style>
</head>

<body>

    <h1>📸 My Beautiful Memory 📸</h1>

    <div class="photo">
        <img src="photo.jpeg" alt="My Photo">
        <p>❤️ Beautiful Memory ❤️</p>
        
    </div>

    <a class="btn" href="page2.html">Next 🎂</a>

</body>
</html>
