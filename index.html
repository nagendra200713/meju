<!DOCTYPE html>
<html lang="en">

<head>
    <title>Happy Birthday</title>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            min-height: 100vh;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ff758c, #ff7eb3, #7b2ff7);
        }

        .container {
            width: 100%;
            height: 100vh;
            position: relative;
            overflow: hidden;
            text-align: center;
            padding-top: 50px;
        }

        /* Heading */

        h1 {
            color: white;
            font-size: clamp(21px, 5vw, 32px);
            line-height: 1.2;

            text-shadow:
                0 0 15px #fff,
                0 0 30px #ff00cc;

            animation: glow 2s infinite alternate;
        }

        h2 {
            margin-top: 12px;
            color: white;
            font-size: clamp(17px, 4vw, 25px);

            animation: fade 2s infinite alternate;
        }

        h3 {
            color: white;
            font-size: clamp(17px, 4vw, 24px);
            margin-top: 5px;

            text-shadow:
                0 0 15px white,
                0 0 30px #ff00cc;

            animation: glow 2s infinite alternate;
        }

        /* Cake Area */

        .cake {
            position: absolute;

            left: 50%;
            top: 48%;

            transform: translate(-50%, -50%);

            width: 100%;
            max-width: 350px;

            display: flex;
            flex-direction: column;
            align-items: center;

            animation: cakeBounce 2s infinite;
        }

        .cake-body {
            font-size: clamp(65px, 18vw, 100px);
            line-height: 1;
        }

        /* Candle */

        .candle {
            position: absolute;

            top: -45px;
            left: 50%;

            transform: translateX(-50%);

            font-size: clamp(35px, 10vw, 50px);

            animation: candleGlow 1s infinite alternate;
        }

        /* Message Box */

        .box {
            width: min(280px, 85vw);

            min-height: 75px;

            margin-top: 10px;

            padding: 12px 15px;

            border: 2px solid rgba(255, 255, 255, 0.85);

            border-radius: 15px;

            background: rgba(255, 255, 255, 0.18);

            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);

            color: white;

            font-family: Arial, sans-serif;

            font-size: 14px;

            /* BOLD */
            font-weight: 900;

            line-height: 1.5;

            text-align: center;

            display: flex;
            align-items: center;
            justify-content: center;

            text-shadow:
                0 1px 3px rgba(0, 0, 0, 0.7);

            box-shadow:
                0 0 10px rgba(255, 255, 255, 0.4),
                0 0 25px rgba(255, 100, 200, 0.5);

            animation: boxGlow 2s infinite alternate;
        }

        /* Start Surprise */

        .message {
            margin-top: 18px;

            width: 100%;

            display: flex;
            justify-content: center;

            animation: messageGlow 2s infinite alternate;
        }

        .btn {
            display: inline-flex;

            align-items: center;
            justify-content: center;

            width: min(220px, 80vw);

            min-height: 50px;

            padding: 12px 20px;

            background: linear-gradient(
                135deg,
                #ff1493,
                #8a2be2
            );

            color: white;

            text-decoration: none;

            border: 2px solid rgba(255, 255, 255, 0.85);

            border-radius: 50px;

            font-family: Arial, sans-serif;

            font-size: 17px;

            font-weight: 900;

            box-shadow:
                0 0 10px #ff1493,
                0 0 25px #8a2be2;

            cursor: pointer;

            transition: 0.4s ease;
        }

        .btn:hover {
            transform: scale(1.06);

            background: linear-gradient(
                135deg,
                #8a2be2,
                #ff1493
            );

            box-shadow:
                0 0 15px white,
                0 0 30px #ff1493,
                0 0 50px #8a2be2;
        }

        .btn:active {
            transform: scale(0.95);
        }

        /* Balloons */

        .balloon {
            position: absolute;

            font-size: clamp(40px, 12vw, 70px);

            animation: float 4s ease-in-out infinite;

            z-index: 1;
        }

        .b1 {
            left: 5%;
            top: 20%;
        }

        .b2 {
            right: 5%;
            top: 23%;
            animation-delay: 1s;
        }

        .b3 {
            left: 8%;
            bottom: 12%;
            animation-delay: 2s;
        }

        .b4 {
            right: 8%;
            bottom: 12%;
            animation-delay: 3s;
        }

        /* Confetti */

        .confetti {
            position: absolute;

            font-size: clamp(20px, 7vw, 30px);

            animation: fall 5s linear infinite;

            z-index: 2;
        }

        .c1 {
            left: 10%;
            top: -10%;
        }

        .c2 {
            left: 35%;
            top: -20%;
            animation-delay: 1s;
        }

        .c3 {
            left: 60%;
            top: -15%;
            animation-delay: 2s;
        }

        .c4 {
            left: 80%;
            top: -20%;
            animation-delay: 3s;
        }

        .c5 {
            left: 50%;
            top: -10%;
            animation-delay: 4s;
        }

        /* Animations */

        @keyframes glow {
            from {
                text-shadow: 0 0 10px white;
            }

            to {
                text-shadow:
                    0 0 30px white,
                    0 0 50px #ff00cc;
            }
        }

        @keyframes fade {
            from {
                opacity: 0.5;
            }

            to {
                opacity: 1;
            }
        }

        @keyframes cakeBounce {
            0%,
            100% {
                transform:
                    translate(-50%, -50%)
                    scale(1);
            }

            50% {
                transform:
                    translate(-50%, -53%)
                    scale(1.05);
            }
        }

        @keyframes candleGlow {
            from {
                filter:
                    drop-shadow(0 0 5px yellow);
            }

            to {
                filter:
                    drop-shadow(0 0 25px orange);
            }
        }

        @keyframes float {
            0%,
            100% {
                transform:
                    translateY(0)
                    rotate(-5deg);
            }

            50% {
                transform:
                    translateY(-35px)
                    rotate(5deg);
            }
        }

        @keyframes fall {
            0% {
                transform:
                    translateY(-100px)
                    rotate(0deg);

                opacity: 1;
            }

            100% {
                transform:
                    translateY(100vh)
                    rotate(360deg);

                opacity: 0;
            }
        }

        @keyframes messageGlow {
            from {
                text-shadow: 0 0 5px red;
            }

            to {
                text-shadow: 0 0 20px white;
            }
        }

        @keyframes boxGlow {
            from {
                box-shadow:
                    0 0 8px rgba(255, 255, 255, 0.3),
                    0 0 15px rgba(255, 100, 200, 0.3);
            }

            to {
                box-shadow:
                    0 0 15px rgba(255, 255, 255, 0.7),
                    0 0 30px rgba(255, 100, 200, 0.7);
            }
        }

        /* Mobile */

        @media (max-width: 600px) {

            .container {
                padding-top: 42px;
            }

            h1 {
                font-size: 21px;
            }

            h2 {
                font-size: 17px;
                margin-top: 9px;
            }

            .cake {
                top: 46%;
            }

            .cake-body {
                font-size: 72px;
            }

            .candle {
                top: -38px;
                font-size: 38px;
            }

            h3 {
                font-size: 18px;
            }

            .box {
                width: 240px;

                min-height: 78px;

                padding: 11px;

                font-size: 13px;

                font-weight: 900;

                line-height: 1.45;
            }

            /* Button directly below box */

            .message {
                margin-top: 16px;
            }

            .btn {
                width: 210px;

                min-height: 50px;

                font-size: 16px;

                padding: 12px 18px;
            }

            .balloon {
                font-size: 45px;
            }

            .b1 {
                left: 2%;
                top: 19%;
            }

            .b2 {
                right: 2%;
                top: 22%;
            }

            .b3 {
                left: 3%;
                bottom: 10%;
            }

            .b4 {
                right: 3%;
                bottom: 10%;
            }

            .confetti {
                font-size: 22px;
            }
        }

        /* Small Mobile */

        @media (max-width: 380px) {

            .container {
                padding-top: 32px;
            }

            h1 {
                font-size: 19px;
            }

            h2 {
                font-size: 15px;
            }

            .cake {
                top: 45%;
            }

            .cake-body {
                font-size: 65px;
            }

            .candle {
                top: -35px;
                font-size: 34px;
            }

            h3 {
                font-size: 16px;
            }

            .box {
                width: 220px;

                min-height: 72px;

                font-size: 12px;

                padding: 9px;
            }

            .message {
                margin-top: 14px;
            }

            .btn {
                width: 195px;

                min-height: 48px;

                font-size: 15px;
            }

            .balloon {
                font-size: 38px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- Heading -->

        <h1>🎉 Happy Birthday Meju 🎉</h1>

        <h2>✨ Have a Wonderful Day! ✨</h2>


        <!-- Balloons -->

        <div class="balloon b1">🎈</div>

        <div class="balloon b2">🎈</div>

        <div class="balloon b3">🎈</div>

        <div class="balloon b4">🎈</div>


        <!-- Cake -->

        <div class="cake">

            <div class="candle">
                🕯️
            </div>

            <div class="cake-body">
                🎂
            </div>

            <h3>
                Make a Wish!
            </h3>

            <!-- Message Box -->

            <div class="box">
                You are my first female friend, and I'll always be a good friend to you.
            </div>

            <!-- Start Surprise Button -->

            <div class="message">

                <a class="btn" href="page1.html">
                    Start Surprise 🎂
                </a>

            </div>

        </div>


        <!-- Confetti -->

        <div class="confetti c1">✨</div>

        <div class="confetti c2">🎊</div>

        <div class="confetti c3">⭐</div>

        <div class="confetti c4">🎉</div>

        <div class="confetti c5">💖</div>

    </div>

</body>

</html>
