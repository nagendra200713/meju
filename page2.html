<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Birthday 🎂</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #ff9a9e, #fad0c4);
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        .birthday-card {
            width: 90%;
            max-width: 420px;
            padding: 25px;
            text-align: center;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 25px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
        }

        .birthday-card h1 {
            color: #ff4081;
            margin-bottom: 20px;
            font-size: 30px;
        }

        /* PHOTO */
        .birthday-photo {
            width: 100%;
            max-width: 320px;
            height: 320px;
            object-fit: cover;
            border-radius: 20px;
            border: 5px solid #ff69a4;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
            margin-bottom: 20px;
        }

        /* MUSIC BUTTON */
        .music-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;

            padding: 14px 25px;
            border-radius: 50px;
            background: linear-gradient(135deg, #ff4f81, #8e44ad);
            color: white;

            font-size: 17px;
            font-weight: bold;

            cursor: pointer;
            user-select: none;

            box-shadow: 0 6px 15px rgba(142, 68, 173, 0.35);

            transition: 0.3s;
        }

        .music-icon:hover {
            transform: scale(1.05);
        }

        .music-icon.playing {
            animation: musicPulse 1s infinite;
        }

        @keyframes musicPulse {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.08);
            }

            100% {
                transform: scale(1);
            }
        }

        .message {
            margin-top: 15px;
            color: #777;
            font-size: 14px;
        }

        /* Floating hearts */
        .heart {
            position: fixed;
            bottom: -30px;
            font-size: 25px;
            animation: floatUp 5s linear infinite;
            pointer-events: none;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0);
                opacity: 1;
            }

            100% {
                transform: translateY(-110vh);
                opacity: 0;
            }
        }
    </style>
</head>

<body>

    <div class="birthday-card">

        <h1>🎉 Happy Birthday 🎂</h1>

        <!-- PHOTO -->
        <!-- Change only this photo name -->
        <img
            src="photo2.jpeg"
            alt="Birthday Photo"
            class="birthday-photo"
        >

        <!-- MUSIC -->
        <div class="music-icon" id="musicBtn">
            🎵 <span id="musicText">Play Birthday Music</span>
        </div>

        <!-- Change only this MP3 name -->
        <audio id="birthdayMusic" src="faaaa.mp3"></audio>

        <p class="message">
            ✨ Have a Wonderful Birthday! ✨
        </p>

    </div>

    <script>
        const musicBtn = document.getElementById("musicBtn");
        const music = document.getElementById("birthdayMusic");
        const musicText = document.getElementById("musicText");

        musicBtn.addEventListener("click", function () {

            if (music.paused) {

                music.play();

                musicText.textContent = "Birthday Music Playing 🎶";
                musicBtn.classList.add("playing");

            } else {

                music.pause();

                musicText.textContent = "Play Birthday Music";
                musicBtn.classList.remove("playing");
            }
        });

        // Music finished
        music.addEventListener("ended", function () {
            musicText.textContent = "Play Birthday Music";
            musicBtn.classList.remove("playing");
        });


        // Floating hearts
        function createHeart() {

            const heart = document.createElement("div");

            heart.className = "heart";
            heart.innerHTML = "😂";

            heart.style.left = Math.random() * 100 + "vw";
            heart.style.animationDuration =
                (3 + Math.random() * 3) + "s";

            document.body.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 6000);
        }

        setInterval(createHeart, 800);
    </script>

</body>
</html>
